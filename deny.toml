[graph]
all-features = true

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436", # paste (transitive via utoipa-axum)
    # Unmaintained transitives we cannot upgrade away from our side (#2175):
    "RUSTSEC-2025-0056", # adler unmaintained (via boxlite -> qcow2-rs -> miniz_oxide 0.7; fix needs upstream boxlite bump)
    "RUSTSEC-2024-0375", # atty unmaintained (via boxlite -> qcow2-rs -> env_logger 0.9; std IsTerminal replacement is upstream's call)
    "RUSTSEC-2025-0141", # bincode unmaintained (via fff-search -> heed and boxlite -> qcow2-rs; alternatives: postcard/bitcode, upstream's call)
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained (via teloxide -> aquamarine, jieba-rs -> include-flate, validator)
    "RUSTSEC-2020-0163", # term_size unmaintained (via boxlite; terminal_size replacement is upstream's call)
    # Vulnerabilities with no semver-compatible fix reachable from our side (#2175):
    # opendal 0.57 (latest release) pins quick-xml ^0.39; the fixes landed in
    # quick-xml 0.41. Drop both ignores when opendal releases against >=0.41.
    "RUSTSEC-2026-0194", # quick-xml quadratic duplicate-attribute check (via opendal-core)
    "RUSTSEC-2026-0195", # quick-xml NsReader memory-exhaustion DoS (via opendal-core)
    "RUSTSEC-2023-0071", # rsa Marvin timing sidechannel (via opendal-core -> reqsign-core; no fixed rsa release exists upstream)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "ISC",
    "OpenSSL",
    "PostgreSQL",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# bzip2-1.0.6 is the permissive BSD-style bzip2/libbzip2 license. Scoped to
# the one crate that ships it (via zip -> bzip2) rather than globally allowed.
exceptions = [
    { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

skip = [
    # Transitive duplicates from ecosystem version fragmentation
    # base64: hdrhistogram (v0.21) vs hyper-util/tonic (v0.22)
    { crate = "base64@0.21.7", reason = "hdrhistogram depends on older version" },
    # getrandom: dirs-sys/redox_users (v0.2) vs newer deps (v0.3)
    { crate = "getrandom@0.2.17", reason = "dirs-sys -> redox_users uses older version" },
    # darling: derive_builder (v0.20) vs bon (v0.23)
    { crate = "darling@0.20.11", reason = "croner -> derive_builder uses older version" },
    { crate = "darling_core@0.20.11", reason = "transitive from darling 0.20" },
    { crate = "darling_macro@0.20.11", reason = "transitive from darling 0.20" },
    # fixedbitset/petgraph: parking_lot_core (v0.4/v0.6) vs prost-build (v0.5/v0.8)
    { crate = "fixedbitset@0.4.2", reason = "parking_lot_core -> petgraph uses older version" },
    { crate = "petgraph@0.6.5", reason = "parking_lot_core uses older version" },
    # hashbrown: petgraph 0.8 (v0.15) vs indexmap (v0.16)
    { crate = "hashbrown@0.15.5", reason = "petgraph 0.8 uses older version" },
    # linux-raw-sys/rustix: procfs (v0.38/v0.4) vs tempfile (v1.x/v0.11)
    { crate = "linux-raw-sys@0.4.15", reason = "procfs -> rustix uses older version" },
    { crate = "rustix@0.38.44", reason = "procfs uses older version" },
    # windows-sys: rustix 0.38 uses older version (only affects Windows platform builds)
    { crate = "windows-sys@0.52.0", reason = "procfs -> rustix 0.38 uses older version" },
    { crate = "windows-sys@0.59.0", reason = "rustix 0.38 uses older version" },
    { crate = "windows-sys@0.61.2", reason = "dirs-sys -> redox_users uses older version" },
    # thiserror: various crates still on v1
    { crate = "thiserror@1.0.69", reason = "ecosystem transition to v2 in progress" },
    { crate = "thiserror-impl@1.0.69", reason = "transitive from thiserror 1.x" },
    # windows-*: ecosystem version fragmentation (rustix 0.38 vs newer versions)
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "windows-targets 0.52.6 uses older version" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "windows-targets 0.52.6 uses older version" },
    { crate = "windows_i686_gnu@0.52.6", reason = "windows-targets 0.52.6 uses older version" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "windows-targets 0.52.6 uses older version" },
    { crate = "windows_i686_msvc@0.52.6", reason = "windows-targets 0.52.6 uses older version" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets 0.52.6 uses older version" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "windows-targets 0.52.6 uses older version" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "windows-targets 0.52.6 uses older version" },
    { crate = "windows-core@0.61.2", reason = "sysinfo uses older version" },
    { crate = "windows-link@0.1.3", reason = "windows-core 0.61 uses older version" },
    { crate = "windows-result@0.3.4", reason = "windows-core 0.61 uses older version" },
    { crate = "windows-strings@0.4.2", reason = "windows-core 0.61 uses older version" },
    { crate = "windows-sys@0.60.2", reason = "socket2 uses intermediate version" },
    { crate = "windows-targets@0.52.6", reason = "windows-sys 0.52 uses older version" },

]

skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # rara-sandbox microVM backend (#1840); upstream publishes git tags only.
    "https://github.com/boxlite-ai/boxlite",
    # fff-search fuzzy file search (#1283); pinned rev, not published to crates.io.
    "https://github.com/dmtrKovalenko/fff.nvim",
]
