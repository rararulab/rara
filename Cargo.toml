# fff (Fast File Finder) — Cargo git dependencies (not vendored).
#
# Pinned to a specific rev because `Cargo.lock` is gitignored workspace-wide
# (see `.gitignore`); without the pin CI re-resolves to upstream HEAD on
# every run and a breaking change upstream (e.g. the `grep_search` visibility
# flip in Apr 2026) takes down every open PR at once. Bump the rev in a
# dedicated PR after updating `crates/app/src/tools/{fff_find,fff_grep}.rs`
# to the new upstream API.
fff-search = { git = "https://github.com/dmtrKovalenko/fff.nvim", rev = "ea1f9802d7879345f02bef72bcadecd7252b8add", features = ["zlob"] }
fff-query-parser = { git = "https://github.com/dmtrKovalenko/fff.nvim", rev = "ea1f9802d7879345f02bef72bcadecd7252b8add", default-features = false }

# zlob is a transitive dep of fff-search (feature = "zlob"); declaring it here
# pins the version across the workspace because `Cargo.lock` is gitignored.
# zlob's bundled `build.zig` targets zig 0.16's `Build.Step.Compile` API
# (the `linkLibC()` method call was removed upstream); releases before 1.3.2
# only compile on zig 0.15. 1.6.1 still builds against the zig 0.16 toolchain.
# Bump this in lockstep with the CI runner's zig toolchain.
zlob = "=1.6.1"

rara-tool-macro = { path = "crates/common/tool-macro" }
tape-codec-zig = { path = "crates/tape-codec-zig", default-features = false }
yunara-store = { path = "crates/common/yunara-store" }

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.19.1"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".tar.gz"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Skip checking whether the specified configuration files are up to date
# (we use ubuntu-latest instead of ubuntu-20.04 which cargo-dist wants)
allow-dirty = ["ci"]
# A GitHub repo to push Homebrew formulas to
tap = "rararulab/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# GitHub-hosted runners for each target (arc-runner-set fleet retired, #2166)
[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-latest"
aarch64-apple-darwin = "macos"
x86_64-unknown-linux-gnu = "ubuntu-latest"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

# System packages cargo-dist installs on Linux runners before building
# (release.yml's `packages_install` matrix step). GitHub-hosted images
# lack these; the retired arc image baked them in (#2166). mold/clang:
# `.cargo/config.toml` forces the mold linker for x86_64 Linux;
# protobuf-compiler: prost-build (api/build.rs) needs protoc.
[workspace.metadata.dist.dependencies.apt]
libsqlite3-dev = '*'
libpq-dev = '*'
protobuf-compiler = '*'
mold = '*'
clang = '*'

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
