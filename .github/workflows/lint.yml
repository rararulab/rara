name: Lint

on:
  workflow_call:
    inputs:
      # Whether the work legs should actually run. The caller (ci.yml)
      # always invokes this workflow — even for diffs that touch no rust
      # paths — because a skipped caller job never materializes the
      # `Lint / Lint Success` required check (#2179). When false, the
      # work legs skip and `lint-success` reports success-via-skip.
      run:
        required: true
        type: boolean

concurrency:
  group: lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

permissions:
  contents: read

# GitHub-hosted runners only — see the note in rust.yml: the self-hosted
# `arc-runner-set` fleet is gone, and it must not appear in any job the
# `Lint Success` required check depends on (#2166).
jobs:
  rust-format:
    name: Rust Format
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      # The old arc image baked nightly rustfmt; GitHub-hosted does not.
      # Date-pinned in lockstep with rust.yml's rustdoc nightly (which is
      # pinned around a rustc ICE) so both gates use one deterministic
      # toolchain; unpin together when a fixed nightly ships.
      - name: Install nightly toolchain (rustfmt)
        run: rustup toolchain install nightly-2026-06-19 --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +nightly-2026-06-19 fmt --all -- --check

  proto-lint:
    name: Protocol Buffer Lint
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      # The old arc image baked buf; GitHub-hosted does not.
      - name: Install buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          setup_only: true

      - name: Buf lint
        run: cd api && buf lint

      - name: Buf format check
        run: cd api && buf format --diff --exit-code

  devtool-checks:
    name: Devtool Checks
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      # Use mise so the Go version stays in lockstep with mise.toml at the
      # repo root (matches go.work). See docs/guides/tooling.md.
      - name: Set up mise toolchain
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

      - name: Build devtool
        run: cd scripts && go build -o bin/devtool ./cmd/devtool/

      - name: Check AGENT.md existence
        run: scripts/bin/devtool check-agent-md

      - name: Check crate dependency direction
        run: scripts/bin/devtool check-deps

      - name: Check CI runner coverage
        run: scripts/bin/devtool check-ci-runners

      # Go gate (#2174): every language in the repo gets a machine gate.
      # golangci-lint comes from mise.toml [tools], so local == CI.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l scripts)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: cd scripts && go vet ./...

      - name: golangci-lint
        run: cd scripts && golangci-lint run

  # Ratchet gate (#2174): high-count lints (dead_code, unreachable_pub,
  # clippy::too_many_lines) are frozen at the committed baseline; any
  # increase per (lint, crate) fails. See scripts/lint-ratchet.sh.
  lint-ratchet:
    name: Lint Ratchet
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    env:
      # See the note in rust.yml: stub the native boxlite build in CI.
      BOXLITE_DEPS_STUB: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      # Single source of truth for the system toolchain (diesel headers,
      # protoc, zig, mold) — see .github/actions/setup-rara-build (#2166).
      - name: Setup rara build environment
        uses: ./.github/actions/setup-rara-build

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Run lint ratchet
        run: scripts/lint-ratchet.sh

  # Zig gate (#2174). The .zig sources live in top-level zig/, built by
  # crates/tape-codec-zig/build.rs. Same toolchain pin as zig-codec-smoke.yml.
  zig-fmt:
    name: Zig Format
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      - name: Install Zig 0.16
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: zig fmt
        run: zig fmt --check zig/build.zig zig/src/

  lint-success:
    name: Lint Success
    runs-on: ubuntu-latest
    needs: [rust-format, proto-lint, devtool-checks, lint-ratchet, zig-fmt]
    if: always()
    steps:
      - name: Check all lint jobs status
        env:
          RUN: ${{ inputs.run }}
          RUST_FORMAT_RESULT: ${{ needs.rust-format.result }}
          PROTO_LINT_RESULT: ${{ needs.proto-lint.result }}
          DEVTOOL_CHECKS_RESULT: ${{ needs.devtool-checks.result }}
          LINT_RATCHET_RESULT: ${{ needs.lint-ratchet.result }}
          ZIG_FMT_RESULT: ${{ needs.zig-fmt.result }}
        run: |
          # A leg satisfies the gate when it succeeded, or when it was
          # legitimately skipped (invoked with run=false: the diff
          # touched no rust paths). `failure`, `cancelled`, or a skip
          # while run=true (broken `if:`, cancelled upstream) must NOT
          # satisfy the required check (#2166 hard rule, #2179).
          leg_ok() {
            [[ "$1" == "success" || ( "$1" == "skipped" && "$RUN" != "true" ) ]]
          }
          echo "run:            $RUN"
          echo "rust-format:    $RUST_FORMAT_RESULT"
          echo "proto-lint:     $PROTO_LINT_RESULT"
          echo "devtool-checks: $DEVTOOL_CHECKS_RESULT"
          echo "lint-ratchet:   $LINT_RATCHET_RESULT"
          echo "zig-fmt:        $ZIG_FMT_RESULT"
          if ! leg_ok "$RUST_FORMAT_RESULT" || ! leg_ok "$PROTO_LINT_RESULT" || \
             ! leg_ok "$DEVTOOL_CHECKS_RESULT" || ! leg_ok "$LINT_RATCHET_RESULT" || \
             ! leg_ok "$ZIG_FMT_RESULT"; then
            echo "One or more lint jobs failed or skipped unexpectedly"
            exit 1
          fi
          echo "All lint jobs passed (or were legitimately skipped)"
