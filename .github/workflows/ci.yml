name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read

# This workflow routes the merge gate: branch protection requires the
# `Rust / Rust Success` and `Lint / Lint Success` check contexts produced
# by the reusable workflows called below. It intentionally has NO
# workflow-level `paths:` filter, and the `rust:`/`lint:` caller jobs
# always run: a skipped caller job never materializes the called
# workflow's check runs, so the required contexts would stay forever
# pending and the PR would be perma-BLOCKED (#2179). Instead the path
# filter result is passed down as the `run` input; the called workflows
# skip their work legs internally and their aggregate jobs report
# success-via-legitimate-skip when `run` is false (#2166, #2179).
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      specs: ${{ steps.filter.outputs.specs }}
      specs_files: ${{ steps.filter.outputs.specs_files }}
      cargo_deps: ${{ steps.filter.outputs.cargo_deps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Filter paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          list-files: shell
          filters: |
            rust:
              - 'crates/**'
              - 'api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # lint.yml also gates Go (scripts/**), Zig (zig/**), clippy
              # config, and the ratchet baseline (scripts/**) — a gate that
              # skips on Go/Zig-only diffs would defeat #2174.
              - 'scripts/**'
              - 'zig/**'
              - 'clippy.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/rust.yml'
              - '.github/workflows/lint.yml'
              - '.github/workflows/e2e.yml'
            web:
              - 'web/**'
              - '.github/workflows/web-ci.yml'
            docs:
              - 'docs/**'
              - '*.md'
              - 'README*'
            specs:
              - 'specs/**'
            cargo_deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'

  lint:
    name: Lint
    needs: changes
    uses: ./.github/workflows/lint.yml
    with:
      run: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'push' }}

  rust:
    name: Rust
    needs: changes
    uses: ./.github/workflows/rust.yml
    with:
      run: ${{ needs.changes.outputs.rust == 'true' || github.event_name == 'push' }}

  # Verifies changed lane-1 Task Contracts: `agent-spec lint` scores the
  # spec, `agent-spec lifecycle` binds its BDD scenarios to real tests.
  # `just spec-selftest` (regression lock for the zero-match false-green,
  # #2165) runs when the target exists — guarded so this job and the
  # sibling PR that defines the target can land in either order.
  agent-spec:
    name: Agent Spec
    needs: changes
    if: ${{ needs.changes.outputs.specs == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Lifecycle runs cargo test selectors — same stub as rust.yml.
      BOXLITE_DEPS_STUB: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # spec-lifecycle runs cargo test selectors, which build the
      # workspace — same system toolchain as rust.yml (#2166).
      - name: Setup rara build environment
        uses: ./.github/actions/setup-rara-build

      - name: Install just
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: just

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      # Pinned; upstream is https://github.com/ZhangHanDong/agent-spec
      # (crates.io). Keep in lockstep with the version `just doctor`
      # enforces locally (#2165).
      - name: Install agent-spec
        run: cargo install --locked agent-spec --version 0.3.0

      - name: Lint + lifecycle changed specs
        env:
          CHANGED_SPECS: ${{ needs.changes.outputs.specs_files }}
        run: |
          ran=0
          for spec in $CHANGED_SPECS; do
            case "$spec" in
              specs/issue-*.spec.md)
                [ -f "$spec" ] || continue  # deleted in this diff
                echo "::group::$spec"
                just spec-lint "$spec"
                just spec-lifecycle "$spec"
                echo "::endgroup::"
                ran=$((ran + 1))
                ;;
            esac
          done
          echo "verified $ran task spec(s)"

      - name: Spec gate self-test
        run: |
          if just --list | grep -q 'spec-selftest'; then
            just spec-selftest
          else
            echo "just spec-selftest not defined yet (lands with #2165); skipping"
          fi

  # Advisory/ban/license/source sweeps against deny.toml. Only makes sense
  # when the dependency graph changes, hence the cargo_deps filter.
  #
  # Real (red = fix it) since #2175 burned the baseline down: triaged
  # advisories are ignored in deny.toml with per-RUSTSEC reasons, git
  # sources are allow-listed, and the bzip2-1.0.6 license has a scoped
  # exception. New findings mean new debt — triage them in deny.toml,
  # do not soften this job back to advisory-only.
  cargo-deny:
    name: Cargo Deny
    needs: changes
    if: ${{ needs.changes.outputs.cargo_deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-deny

      - name: Check advisories, bans, licenses, sources
        run: cargo deny check

  # Detects unused dependencies declared in Cargo.toml files.
  #
  # Real (red = fix it) since #2175 removed the 80+ finding baseline.
  # Genuine false positives (codegen-only or pin-activation deps) belong in
  # a [package.metadata.cargo-shear] ignored list with a justification
  # comment — see api/Cargo.toml and crates/app/Cargo.toml for the pattern.
  cargo-shear:
    name: Cargo Shear
    needs: changes
    if: ${{ needs.changes.outputs.cargo_deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install cargo-shear
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-shear

      - name: Check for unused dependencies
        run: cargo shear

  release-pr:
    name: Release PR
    needs: [lint, rust]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.rust.result == 'success' || needs.rust.result == 'skipped') }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-pr.yml
