name: zig-codec-smoke

# Observability-only smoke test for the issue #2007 PoC. Builds and tests
# the `tape-codec-zig` crate plus the `rara-kernel` package with the
# `zig-codec` feature enabled, on macOS and Linux. NOT a merge gate —
# the spec's `Out of Scope` explicitly disallows wiring this into
# required CI checks. The job exists so that a future maintainer can
# look at recent runs and answer "does Zig still build on Linux?"
# without spinning up a runner manually.
#
# The linux job runs on GitHub-hosted `ubuntu-latest` and installs
# mold + clang explicitly: `.cargo/config.toml` forces `linker = "clang"`
# + `-fuse-ld=mold` for `x86_64-unknown-linux-gnu` (see #2010). This
# deliberately reverses #2047 (which moved the job onto `arc-runner-set`
# for the baked-in mold baseline) — that fleet no longer exists and jobs
# targeting it queue for 24h and get cancelled (#2166).
#
# The macos job is pinned to `macos-15` (#2187): the `macos-26-arm64`
# image (Xcode 26.5 / CLT 26.6) ships a newer ld that hard-errors on
# zig 0.16's under-padded `compiler_rt.o` archive member ("64-bit
# mach-o member not 8-byte aligned"), so `macos-latest` fails whenever
# the alias resolves to macOS 26 (run 28704763601 failed on
# macos-26-arm64; run 28703902869 passed on macos-15-arm64, 35 minutes
# apart). Unpin when either a tagged zig release fixes MachO archive
# member alignment and we adopt it, or the build.rs re-pack of the
# zig-emitted `.a` (e.g. via `libtool -static`) lands — see the
# follow-up named in #2187.

on:
  pull_request:
    paths:
      - "crates/tape-codec-zig/**"
      - "crates/kernel/Cargo.toml"
      - "crates/kernel/src/memory/store.rs"
      - "crates/kernel/src/memory/codec.rs"
      - "crates/kernel/src/memory/error.rs"
      - "Cargo.toml"
      - ".github/workflows/zig-codec-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold clang

      - name: Install Zig 0.16
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Verify zig version
        run: zig version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test -p tape-codec-zig
        run: cargo test -p tape-codec-zig

      - name: cargo build -p rara-kernel --features zig-codec
        run: cargo build -p rara-kernel --features zig-codec
